name: AntiEnchants
version: '${version}'
main: dev.scrulius.antienchants.AntiEnchantsPlugin
api-version: '1.21'
author: Scrulius
description: Blocks unwanted enchantments server-wide (successor to AntiMending).

commands:
  antienchants:
    description: AntiEnchants main command.
    usage: /antienchants <reload|list|check|add|remove>
    aliases: [ae, antienchant]
    permission: antienchants.admin

permissions:
  antienchants.admin:
    description: Allows managing AntiEnchants (reload, list, check, add, remove).
    default: op
  antienchants.bypass.*:
    description: Bypass every AntiEnchants restriction (per-enchant children are registered at runtime).
    default: false
