name: AntiEnchants
version: '${version}'
main: dev.scrulius.antienchants.AntiEnchantsPlugin
api-version: '1.21'
author: Scrulius
description: Blocks unwanted enchantments server-wide (successor to AntiMending).

commands:
  antienchants:
    description: AntiEnchants main command.
    usage: /antienchants reload
    aliases: [ae, antienchant]
    permission: antienchants.admin

permissions:
  antienchants.admin:
    description: Allows reloading the AntiEnchants configuration.
    default: op
